name: Windows setup build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-setup-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Plan the next main release
        id: release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B .\scripts\release.py plan --output .\dist\release-plan
      - name: Run isolated tests
        run: .\scripts\test.ps1 -SkipSandboxOnly
      - name: Verify the source download executable is current
        run: .\scripts\check-bundled-gui.ps1
      - name: Build unsigned setup and checksums
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.tag }}
        run: |
          $version = if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION } else { 'development' }
          .\scripts\build-release.ps1 -Version $version
      - name: Require Defender scan before distributing the executable
        run: |
          $ErrorActionPreference = 'Stop'
          $status = Get-MpComputerStatus
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) { throw 'Defender is unavailable; binary distribution is blocked.' }
          Update-MpSignature
          $platform = Get-ChildItem -LiteralPath "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $platform) { throw 'Defender scanner was not found.' }
          foreach ($relative in @('whas-gui.exe', 'dist/release/whas-gui.exe')) {
            $exe = (Resolve-Path -LiteralPath $relative).Path
            $before = (Get-FileHash -LiteralPath $exe).Hash
            $began = Get-Date
            & (Join-Path $platform.FullName 'MpCmdRun.exe') -Scan -ScanType 3 -File $exe
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $exe)) { throw 'Defender scan failed or removed the executable.' }
            if ((Get-FileHash -LiteralPath $exe).Hash -cne $before) { throw 'Executable changed during scanning.' }
            $detections = @(Get-MpThreatDetection | Where-Object { $_.InitialDetectionTime -ge $began -and ($_.Resources -join ' ').IndexOf($exe, [StringComparison]::OrdinalIgnoreCase) -ge 0 })
            if ($detections.Count) { throw 'Defender detected this executable; distribution is blocked.' }
          }
      - name: Upload setup assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whas-windows-x64
          path: |
            dist/release/whas-gui.exe
            dist/release/whas-windows-x64-*.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload the tested release plan
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whas-release-plan
          path: dist/release-plan/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.publish == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      actions: read
      contents: write
