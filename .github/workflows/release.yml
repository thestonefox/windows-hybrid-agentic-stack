name: Publish Windows release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Download scanned packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: whas-windows-x64
          path: dist/release-assets
      - name: Download the tested release plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: whas-release-plan
          path: dist/release-plan
      - name: Tag the tested commit and publish its packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B .\scripts\release.py publish --plan .\dist\release-plan\plan.json --assets .\dist\release-assets
